<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pong Wars - Go Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
    }
  </style>
  <script src="/wasm_exec.js"></script>
  <script>
    if (typeof Go === 'undefined') {
      console.error('Go WASM runtime (wasm_exec.js) not loaded');
    } else {
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch('/wasm/pong.wasm'), go.importObject)
        .then((result) => {
          go.run(result.instance);
        })
        .catch((err) => {
          console.error('Failed to start Pong Wars WASM:', err);
        });
    }
  </script>
</head>
<body>
</body>
</html>
