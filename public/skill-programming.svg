<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none">
  <!-- Terminal/code editor window -->
  <rect x="20" y="10" width="160" height="100" rx="8" stroke="rgba(160,175,210,0.35)" stroke-width="1.5" fill="rgba(255,255,255,0.02)"/>
  <!-- Title bar dots -->
  <circle cx="36" cy="24" r="3" fill="rgba(255,100,100,0.5)"/>
  <circle cx="48" cy="24" r="3" fill="rgba(255,200,50,0.5)"/>
  <circle cx="60" cy="24" r="3" fill="rgba(100,220,100,0.5)"/>
  <!-- Divider -->
  <line x1="20" y1="34" x2="180" y2="34" stroke="rgba(160,175,210,0.15)" stroke-width="1"/>
  <!-- Code lines -->
  <rect x="34" y="44" width="40" height="4" rx="2" fill="rgba(68,184,243,0.45)"/>
  <rect x="80" y="44" width="24" height="4" rx="2" fill="rgba(160,175,210,0.25)"/>
  <rect x="46" y="56" width="56" height="4" rx="2" fill="rgba(160,175,210,0.2)"/>
  <rect x="108" y="56" width="32" height="4" rx="2" fill="rgba(100,200,150,0.35)"/>
  <rect x="46" y="68" width="36" height="4" rx="2" fill="rgba(200,170,255,0.35)"/>
  <rect x="88" y="68" width="48" height="4" rx="2" fill="rgba(160,175,210,0.2)"/>
  <rect x="34" y="80" width="28" height="4" rx="2" fill="rgba(68,184,243,0.45)"/>
  <rect x="46" y="92" width="64" height="4" rx="2" fill="rgba(160,175,210,0.2)"/>
  <!-- Cursor blink -->
  <rect x="116" y="90" width="2" height="8" rx="1" fill="rgba(160,175,210,0.5)"/>
</svg>
